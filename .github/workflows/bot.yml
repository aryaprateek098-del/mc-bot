name: Minecraft 24/7 Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install mineflayer

    - name: Run Minecraft Bot
      env:
        MC_HOST: kiingdomsmp.aternos.me
        MC_PORT: 36463
        MC_USERNAME: GUARDIAN
      run: |
        node -e '
        const mineflayer = require("mineflayer");
        const bot = mineflayer.createBot({
          host: process.env.MC_HOST,
          port: parseInt(process.env.MC_PORT),
          username: process.env.MC_USERNAME || "AstraBot",
          version: false
        });

        bot.on("spawn", () => {
          console.log("Bot server me ghus gaya hai!");
          setInterval(() => {
            const actions = ["forward", "back", "left", "right"];
            const randomAction = actions[Math.floor(Math.random() * actions.length)];
            bot.setControlState(randomAction, true);
            setTimeout(() => bot.setControlState(randomAction, false), 1500);
            if (Math.random() > 0.5) {
              bot.setControlState("jump", true);
              setTimeout(() => bot.setControlState("jump", false), 500);
            }
            bot.look(Math.random() * Math.PI * 2, (Math.random() * Math.PI) - (Math.PI / 2), true);
          }, 10000);
        });

        bot.on("kicked", (reason) => console.log("Kick ho gaya: " + reason));
        bot.on("error", (err) => console.log("Error: " + err));
        '
